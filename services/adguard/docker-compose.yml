services:
  adguard:
    image: adguard/adguardhome
    restart: unless-stopped
    networks:
      frontend:
        ipv4_address: 172.20.0.10
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
