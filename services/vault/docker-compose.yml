services:
  vault:
    image: hashicorp/vault:1.17.6
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: not-secret
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - ./data/vault/file:/vault/file
    command: server -dev -dev-listen-address=0.0.0.0:8200
