services:
  nginx-proxy-manager:
    image: jcberkheimer/nginx-proxy-manager:2.10.3
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "8080:80"
      - "8443:443"
      - "81:81"
    volumes:
      - ./data/npm/data:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt
    labels:
      - "traefik.enable=false"
